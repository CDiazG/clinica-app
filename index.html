<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Clínica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123047">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1b2731;--mut:#5f6f7a;--line:#d9e1e7;--ac:#0b5f86;--ac2:#e3f0f6;--hd:#123047;--warn:#9a4a06;--warnbg:#fff3e0;--danger:#b42318;--dbg:#fdecea;--ok:#067647;--okbg:#e7f6ec;--r:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;position:sticky;top:0;z-index:20}
.hin{max-width:1400px;margin:auto;display:flex;align-items:center;gap:18px;padding:0 16px;height:54px}
.brand{font-weight:700;display:flex;gap:9px;align-items:center;white-space:nowrap;cursor:pointer}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav button{background:none;border:0;color:#b9cbd8;padding:16px 12px;border-radius:0;border-bottom:3px solid transparent}
.nav button:hover{color:#fff;border-color:transparent}
.nav button.active{color:#fff;border-bottom-color:#6fc3e8}
.user{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.user .mut{color:#9db3c3}
.user button{background:transparent;color:#dce8f0;border-color:#3d5b72}
main{max-width:1400px;margin:auto;padding:18px 16px 70px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);white-space:nowrap}
button:hover{border-color:#a9b8c1}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
button.primary:hover{background:#094c6b}
button.danger{color:var(--danger)}
button.sm{padding:3px 9px;font-size:13px}
button.link{border:0;background:none;color:var(--ac);padding:2px 0}
a{color:var(--ac)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:inherit}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,.editor:focus{outline:3px solid var(--ac2);border-color:var(--ac)}
input:disabled,input[readonly]{background:#f2f5f7}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
label.row{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.row input[type=radio],label.row input[type=checkbox],input[type=checkbox]{width:auto}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);font-weight:700;margin-top:6px}
h2{font-size:20px;margin:0}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.p0{padding:0;overflow-x:auto}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grow{flex:1}
.mut{color:var(--mut)}
.sm{font-size:13px}
.r{text-align:right}
.nowrap{white-space:nowrap}
.empty{padding:30px 16px;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.full{grid-column:1/-1}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.span2,.span3{grid-column:1/-1}.brand span,.user .mut{display:none}}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#f8fafc;white-space:nowrap}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ac)}
tr.filters th{padding:5px 6px;background:#f8fafc}
tr.filters input{padding:4px 7px;font-size:13px;font-weight:400}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--ac2)}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border:0;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--dbg);color:var(--danger)}
button.tag{cursor:pointer}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.search{flex:1;min-width:240px;position:relative}
.search input{padding:11px 12px 11px 38px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
/* login */
.login{max-width:380px;margin:9vh auto 0}
.login .card{padding:26px}
.login h2{margin-bottom:4px}
.login form{display:grid;gap:12px;margin-top:16px}
/* home */
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.home{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:17px;font-weight:650;text-align:left;white-space:normal}
.tile:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(11,95,134,.1)}
.tile .ic{width:42px;height:42px;border-radius:10px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}
.tile small{font-size:13px;font-weight:400;color:var(--mut)}
/* ficha */
.ficha-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.pname{font-size:23px;font-weight:700;letter-spacing:.01em}
.pdata{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pdata div{padding:6px 10px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.pdata .k{background:#f6f9fb;color:var(--mut);font-size:13px}
@media(max-width:760px){.pdata{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.alerg{background:var(--dbg);color:var(--danger);padding:7px 12px;border-radius:8px;font-weight:600;margin-top:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;align-items:flex-end}
.tabs button{border:0;border-radius:0;background:none;padding:10px 13px;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.active{color:var(--ac);border-bottom-color:var(--ac);font-weight:650}
.tabs .sp{flex:1}
.tabs .pr{border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin-bottom:6px;color:var(--ink);background:#fff}
/* historial */
.hlist{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hdate{font-weight:650;font-size:14px}
.htext{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fb;border-radius:6px;padding:7px 10px;min-height:36px}
@media(max-width:700px){.hrow{grid-template-columns:1fr}}
.qbtns{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.qbtns button{font-size:12px;padding:3px 8px;background:#f6f9fb}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.ver.cur{border-color:var(--ac)}
.vh{font-size:13px;color:var(--mut);margin-bottom:6px}
/* docs */
.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}
@media(max-width:760px){.calc{grid-template-columns:1fr 1fr}}
input.num{text-align:right}
table.rx{width:100%;border-collapse:collapse;min-width:560px}
table.rx th{font-size:12px;color:var(--mut);font-weight:600;padding:3px 4px;text-align:left}
table.rx td{padding:3px}
.scroll{overflow-x:auto}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:5px;background:#f6f9fb}
.toolbar button{padding:3px 9px;font-size:13px}
.editor{min-height:240px;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px 12px;background:#fff;overflow:auto}
details summary{cursor:pointer;color:var(--ac);font-size:14px;margin:4px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.mdl{background:#fff;border-radius:12px;width:min(580px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px}
.x{border:0;font-size:22px;line-height:1;padding:2px 8px;color:var(--mut)}
.mb{padding:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.stack{display:grid;gap:10px}
.sellist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:4px}
/* agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.week button{display:flex;flex-direction:column;align-items:center;padding:7px 4px;white-space:normal;font-size:13px}
.week button b{font-size:17px}
.week button.sel{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.week button.hoy b{text-decoration:underline}
.pick{position:relative}
.pkres{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;max-height:260px;overflow:auto}
.pkres div{padding:7px 10px;cursor:pointer;font-size:14px}
.pkres div:hover{background:var(--ac2)}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--ac2);color:var(--ac);border-radius:20px;padding:4px 6px 4px 12px;font-weight:600;font-size:14px}
/* config */
.cfgnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cfgnav button.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2830;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.logo-prev{max-height:56px;max-width:170px;border:1px solid var(--line);border-radius:6px;padding:3px;background:#fff}
mark{background:#ffe58a;padding:0 1px}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(180,35,24,.18)}}
.dicbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1c2830;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;z-index:90;display:flex;gap:12px;align-items:center;max-width:min(760px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dicbar .dot{width:10px;height:10px;border-radius:50%;background:#ff5a4e;flex:none;animation:pulse 1.4s infinite}
.dicbar .txt{font-size:14px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px}
.dicbar button{background:#fff;border:0}
input.flash,select.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#c9efd6;border-color:var(--ok)}100%{background:#fff}}
.nube{font-size:13px;color:#cfe3ef;cursor:pointer;white-space:nowrap;padding:4px 8px;border-radius:6px}
.nube:hover{background:rgba(255,255,255,.1)}.nube.err{color:#ffb4a8}
.help{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.infgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.infgrid{grid-template-columns:1fr}}
.prevwrap{position:sticky;top:66px;background:#e9eef2;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.prevwrap iframe{width:100%;height:78vh;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:2px}
.today li{margin:3px 0}
</style>
</head>
<body>
<header id="hdr" hidden></header>
<main id="app"><div class="empty">Cargando…</div></main>
<input type="file" id="fimport" accept=".json,application/json" hidden>
<input type="file" id="flogo" accept="image/*" hidden>
<input type="file" id="ffiles" multiple hidden>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const APP_VERSION='3.0.2';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>isoD(new Date());
const pDate=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=pDate(iso);d.setDate(d.getDate()+n);return isoD(d)};
const fdate=iso=>{if(!iso)return'';const[y,m,d]=String(iso).slice(0,10).split('-');return `${d}/${m}/${y}`};
const fdt=ts=>ts?new Date(ts).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}):'';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaGuion=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return `${+d} - ${MESES[+m-1]} - ${y}`};
const fechaLarga=iso=>{const[y,m,d]=iso.split('-').map(Number);return `${d} de ${MESES[m-1]} de ${y}`};
const diaSem=iso=>pDate(iso).toLocaleDateString('es-ES',{weekday:'long'});
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(+n||0);
const n2=n=>(+n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100;
const pnum=v=>parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'))||0;
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const compact=s=>norm(s).replace(/[^a-z0-9]/g,'');
const UP=s=>String(s||'').toLocaleUpperCase('es-ES');
const edad=f=>{if(!f)return'';const b=pDate(f),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a};
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function setPath(o,p,v){const k=p.split('.');let c=o;k.slice(0,-1).forEach(x=>c=c[x]=c[x]||{});c[k[k.length-1]]=v}
function formObj(f){const o={};for(const el of f.elements){if(!el.name||el.disabled)continue;if(el.type==='radio'&&!el.checked)continue;if(el.type==='file')continue;setPath(o,el.name,el.type==='checkbox'?el.checked:el.value.trim())}return o}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
function descargar(nombre,contenido,tipo){const b=contenido instanceof Blob?contenido:new Blob([contenido],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function snippet(text,q){const t=String(text||''),nt=norm(t),nq=norm(q).trim();const i=nq?nt.indexOf(nq):-1;
  if(i<0)return esc(t.slice(0,200))+(t.length>200?'…':'');
  const a=Math.max(0,i-80),b=Math.min(t.length,i+nq.length+140);
  return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+nq.length))+'</mark>'+esc(t.slice(i+nq.length,b))+(b<t.length?'…':'')}
function numLetras(n){
  const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const Dd=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const ap=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const t=n=>{if(n===100)return'cien';const h=Math.floor(n/100),r=n%100;let s=h?C[h]:'';if(r)s+=(s?' ':'')+(r<30?U[r]:Dd[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''));return s};
  const g=n=>{if(n===0)return'cero';const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000;let s='';
    if(mi)s+=mi===1?'un millón':ap(t(mi))+' millones';if(mil)s+=(s?' ':'')+(mil===1?'mil':ap(t(mil))+' mil');if(r)s+=(s?' ':'')+t(r);return s};
  const cents=Math.round((+n||0)*100),e=Math.floor(cents/100),c=cents%100;
  let s=ap(g(e))+(e===1?' euro':' euros');if(c)s+=' con '+ap(g(c))+(c===1?' céntimo':' céntimos');return s}
async function sha(t){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=0x811c9dc5;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return'f'+h.toString(16)}
const ss={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

/* ================= iconos ================= */
const ICO={
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 0 1 0 8M19 21c0-3-1.5-5.5-4-6.5"/>',
  glasses:'<circle cx="6.5" cy="14" r="4"/><circle cx="17.5" cy="14" r="4"/><path d="M10.5 14h3M2.5 14 4 7M21.5 14 20 7"/>',
  rx:'<path d="M7 3h8l4 4v14H7z"/><path d="M10 10h3a2 2 0 0 1 0 4h-3v-4zm0 4v4m3-4 3 4"/>',
  tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',

const NUBE={cfg:null,auth:null,ck:null,meta:null,estado:'',pend:0,ultima:null,error:''};

const owner=()=>NUBE.cfg.pid+':'+NUBE.auth.uid;

const nubeErr=(code,msg)=>{const e=new Error(msg);e.code=code;return e};
function msgAuth(s){return /INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(s)?'Correo o contraseña incorrectos.':/TOO_MANY/.test(s)?'Demasiados intentos. Espera unos minutos.':/API_KEY|API key/i.test(s)?'La clave web (API key) no es válida. Revísala.':/USER_DISABLED/.test(s)?'Usuario desactivado en Firebase.':/WEAK_PASSWORD/.test(s)?'La contraseña es demasiado débil (mínimo 6 caracteres).':s||'Error de acceso'}
async function authPost(op,body){let r;try{r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${op}?key=${encodeURIComponent(NUBE.cfg.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw nubeErr('red','Sin conexión a internet.')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw nubeErr('auth',msgAuth(j.error&&j.error.message));return j}
async function entrarFirebase(email,pw){const j=await authPost('signInWithPassword',{email,password:pw,returnSecureToken:true});
  NUBE.auth={uid:j.localId,email:j.email,idt:j.idToken,rt:j.refreshToken,exp:Date.now()+(+j.expiresIn||3600)*1000};ss.set('cl_auth',NUBE.auth);return NUBE.auth}
async function token(force){const a=NUBE.auth;if(!a)throw nubeErr('sesion','Sesión cerrada');if(!force&&a.idt&&a.exp>Date.now()+90000)return a.idt;let r;
  try{r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(NUBE.cfg.key),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.rt)})}catch(e){throw nubeErr('red','Sin conexión a internet.')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw nubeErr('sesion','La sesión ha caducado. Vuelve a entrar.');
  a.idt=j.id_token;a.rt=j.refresh_token||a.rt;a.exp=Date.now()+(+j.expires_in||3600)*1000;ss.set('cl_auth',a);return a.idt}
async function fsFetch(url,opt={},retry=true){const t=await token();let r;
  try{r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}})}catch(e){throw nubeErr('red','Sin conexión a internet.')}
  if(r.status===401&&retry){await token(true);return fsFetch(url,opt,false)}
  if(r.status===404&&(!opt.method||opt.method==='GET'))return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(Array.isArray(j)?j[0]:j)?.error?.message||('error '+r.status);
    throw nubeErr(r.status===403?'permiso':'fs',r.status===403?'Firebase ha denegado el acceso: revisa las reglas de Firestore (Configuración → Nube).':/database.*does not exist|NOT_FOUND/i.test(m)?'No existe la base de datos Firestore en ese proyecto. Créala en la consola de Firebase.':m)}
  return j}
const fsGet=(col,id)=>fsFetch(`${fsBase()}/${col}/${id}`).then(d=>d&&d.fields);
const fsCommit=writes=>fsFetch(fsBase()+':commit',{method:'POST',body:JSON.stringify({writes})});

/* cifrado AES-GCM 256 con clave derivada (PBKDF2-SHA256) de la clave de cifrado; la clave derivada se guarda en este equipo como no exportable */
const b64=buf=>{const b=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const TE=new TextEncoder(),TD=new TextDecoder();
async function derivar(pass,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function cifrar(data,aad,key=NUBE.ck){const iv=crypto.getRandomValues(new Uint8Array(12));const pt=typeof data==='string'?TE.encode(data):data;
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(aad)},key,pt));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out)}
async function descifrar(s,aad,key=NUBE.ck){const u=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12),additionalData:TE.encode(aad)},key,u.subarray(12)))}

/* cola de envío */
async function encolar(col,id,del=false){if(col==='config')id='config';await putRaw('outbox',{k:col+'/'+id,col,id,del,t:Date.now()});programarEnvio()}
let _envT;function programarEnvio(){clearTimeout(_envT);_envT=setTimeout(()=>enviar(),700);NUBE.pend++;pintarNube()}
function cfgParaNube(){const c=clone(D.config);c.ia={...c.ia,key:c.ia.key||iaKeyLocal()};c.usuarios=(c.usuarios||[]).map(u=>({id:u.id,nombre:u.nombre}));return c}
let _enviando=false;
async function enviar(){if(!NUBE.ck||!NUBE.auth||_enviando)return;_enviando=true;pintarNube('sube');
  try{let items=await getAll('outbox');
    const docs=items.filter(i=>i.col!=='blobs');
    for(let i=0;i<docs.length;i+=150){const lote=docs.slice(i,i+150);const writes=[];
      for(const it of lote){const nm=docName(it.col,it.id);
        let obj=it.del?null:it.col==='config'?cfgParaNube():await getOne(it.col,it.id);
        if(!obj)writes.push({update:{name:nm,fields:{del:{booleanValue:true}}},updateTransforms:[{fieldPath:'m',setToServerValue:'REQUEST_TIME'}]});
        else writes.push({update:{name:nm,fields:{del:{booleanValue:false},d:{stringValue:await cifrar(JSON.stringify(obj),it.col+'/'+it.id)}}},updateTransforms:[{fieldPath:'m',setToServerValue:'REQUEST_TIME'}]})}
      await fsCommit(writes);await quitarDeCola(lote)}
    for(const it of items.filter(i=>i.col==='blobs')){
      if(it.del){const ws=[];for(let j=0;j<(it.n||1);j++)ws.push({delete:docName('blobs',it.id+'_'+j)});await fsCommit(ws)}
      else{const r=await getOne('blobs',it.id);if(r&&r.blob){const u=new Uint8Array(await r.blob.arrayBuffer());const n=Math.max(1,Math.ceil(u.length/CH));
        for(let j=0;j<n;j+=4){const ws=[];for(let q=j;q<Math.min(n,j+4);q++)ws.push({update:{name:docName('blobs',it.id+'_'+q),fields:{f:{stringValue:it.id},i:{integerValue:String(q)},n:{integerValue:String(n)},d:{stringValue:await cifrar(u.subarray(q*CH,(q+1)*CH),'blobs/'+it.id+'_'+q)}}}});await fsCommit(ws)}}}
      await quitarDeCola([it])}
    NUBE.error='';NUBE.ultima=Date.now()}
  catch(e){NUBE.error=e.message;console.warn('Envío a la nube:',e);if(e.code==='permiso'||e.code==='sesion')toast(e.message)}
  finally{_enviando=false;NUBE.pend=(await getAll('outbox')).length;pintarNube();if(NUBE.pend&&!NUBE.error)programarEnvio()}}
async function quitarDeCola(lote){const actuales=await getAll('outbox');for(const it of lote){const a=actuales.find(x=>x.k===it.k);if(a&&a.t===it.t)await delRaw('outbox',it.k)}}

/* descarga de cambios (solo lo modificado desde la última vez) */
function syncKey(){return 'cl_sync_'+owner()}
let _bajando=false;
async function bajar(progreso){if(!NUBE.ck||!NUBE.auth||_bajando)return 0;_bajando=true;let cambios=0;pintarNube('baja');
  try{const marcas=ls.get(syncKey())||{};const pend=new Set((await getAll('outbox')).map(x=>x.k));
    for(const col of SYNC_COLS){let desde=marcas[col]?new Date(Date.parse(marcas[col])-3000).toISOString():'1970-01-01T00:00:00Z';let cursor=null,max=marcas[col]||null;
      for(;;){const sq={from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:'m'},op:'GREATER_THAN_OR_EQUAL',value:{timestampValue:desde}}},orderBy:[{field:{fieldPath:'m'},direction:'ASCENDING'},{field:{fieldPath:'__name__'},direction:'ASCENDING'}],limit:300};
        if(cursor)sq.startAt={values:[{timestampValue:cursor.m},{referenceValue:cursor.name}],before:false};
        const res=(await fsQuery(sq))||[];const docs=res.filter(x=>x.document).map(x=>x.document);if(!docs.length)break;
        for(const d of docs){const id=d.name.split('/').pop(),f=d.fields||{},m=f.m&&f.m.timestampValue;cursor={m,name:d.name};if(m&&(!max||m>max))max=m;
          const k=col+'/'+(col==='config'?'config':id);if(pend.has(k))continue;
          if(f.del&&f.del.booleanValue){if(col!=='config'&&D[col].some(x=>x.id===id)){await delRaw(col,id);memDel(col,id);cambios++}continue}
          if(!f.d)continue;let obj;try{obj=JSON.parse(TD.decode(await descifrar(f.d.stringValue,col+'/'+(col==='config'?'config':id))))}catch(e){console.warn('No se pudo descifrar',k);continue}
          if(col==='config'){obj=mergeCfg(obj);if(obj.ia.key)iaKeyLocal(obj.ia.key);else obj.ia.key=iaKeyLocal();obj.id='config'}
          await putRaw(col,obj);memPut(col,obj);cambios++}
        if(progreso)progreso(col,cambios);
        if(docs.length<300)break}
      if(max)marcas[col]=max;ls.set(syncKey(),marcas)}
    NUBE.error='';NUBE.ultima=Date.now()}
  catch(e){NUBE.error=e.message;console.warn('Descarga de la nube:',e);if(e.code==='permiso'||e.code==='sesion')toast(e.message)}
  finally{_bajando=false;pintarNube()}
  return cambios}
async function sincronizar(progreso){await enviar();const n=await bajar(progreso);if(n)refrescarSiSeguro();return n}
function editando(){const a=document.activeElement;return !!($('.ov')||DIC||(a&&a!==document.body&&$('#app').contains(a)&&(a.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'&&a.id!=='gq')))}

function pintarNube(fase){const el=$('#nubeEst');if(!el)return;const p=NUBE.pend;
  el.className='nube'+(NUBE.error?' err':'');
  el.textContent=NUBE.error?(navigator.onLine?'⚠ Error de nube':'⚠ Sin conexión')+(p?` · ${p} pendiente${p>1?'s':''}`:''):fase==='sube'?'☁ Guardando…':fase==='baja'?'☁ Actualizando…':p?`☁ ${p} pendiente${p>1?'s':''}`:'☁ Al día';
  el.title=NUBE.error?NUBE.error+' — pulsa para reintentar':'Datos cifrados en Firebase'+(NUBE.ultima?' · última sincronización '+fdt(NUBE.ultima):'')+' — pulsa para sincronizar'}

/* restaurar una copia: sustituye todo, también en la nube */
async function restaurarNube(data){
  const cfg=mergeCfg({...data.config});cfg.usuarios=D.config.usuarios;cfg.ia={...cfg.ia,key:D.config.ia.key||iaKeyLocal()};cfg.id='config';
  const blobs=[];for(const b of data.blobs||[]){blobs.push({id:b.id,blob:await (await fetch(b.data)).blob()})}
  const now=Date.now();
  await new Promise((res,rej)=>{const t=db.transaction([...STORES,'outbox'],'readwrite');const ob=t.objectStore('outbox');
    for(const s of DATA){const os=t.objectStore(s);const nuevos=new Set((data[s]||[]).map(x=>x.id));
      for(const x of D[s])if(!nuevos.has(x.id))ob.put({k:s+'/'+x.id,col:s,id:x.id,del:true,t:now});
      os.clear();(data[s]||[]).forEach(x=>{if(x&&x.id){os.put(x);ob.put({k:s+'/'+x.id,col:s,id:x.id,del:false,t:now})}})}
    t.objectStore('config').put(cfg);ob.put({k:'config/config',col:'config',id:'config',del:false,t:now});
    const bs=t.objectStore('blobs');blobs.forEach(b=>{bs.put(b);ob.put({k:'blobs/'+b.id,col:'blobs',id:b.id,del:false,t:now})});
    t.oncomplete=res;t.onerror=()=>rej(t.error)});
  await cargarTodo();asegurarUsuario();programarEnvio()}
async function limpiarLocal(){await new Promise((res,rej)=>{const t=db.transaction([...STORES,'outbox'],'readwrite');[...STORES,'outbox'].forEach(s=>t.objectStore(s).clear());t.oncomplete=res;t.onerror=()=>rej(t.error)});DATA.forEach(s=>D[s]=[]);D.config=mergeCfg(null)}
function asegurarUsuario(){const a=NUBE.auth;if(!a)return false;let u=D.config.usuarios.find(x=>x.id===a.uid),nuevo=false;
  if(!u){u={id:a.uid,nombre:a.email};D.config.usuarios=[...D.config.usuarios.filter(x=>x.id&&x.nombre),u];nuevo=true}
  SES.user={id:a.uid,nombre:u.nombre||a.email,login:a.email,rol:'medico'};return nuevo}

/* numeración */
function fmtNum(serie,n,anio){return serie.formato.replace(/\{serie\}/g,serie.codigo).replace(/\{n4\}/g,String(n).padStart(4,'0')).replace(/\{n\}/g,n).replace(/\{año\}/g,anio).replace(/\{aa\}/g,String(anio).slice(2))}
const usaAnio=s=>/\{año\}|\{aa\}/.test(s.formato);
const listaDe=tipo=>tipo==='factura'?D.facturas:D.recibos;
function siguiente(serie,fecha){const anio=(fecha||hoy()).slice(0,4);const n=listaDe(serie.tipo).filter(x=>x.serieId===serie.id&&(!usaAnio(serie)||x.anio===anio)).reduce((m,x)=>Math.max(m,x.seq||0),0)+1;return{seq:n,anio,numero:fmtNum(serie,n,anio)}}
function parseSeq(serie,numero){let re='';for(const p of serie.formato.split(/(\{serie\}|\{n4\}|\{n\}|\{año\}|\{aa\})/)){if(p==='{serie}')re+=reEsc(serie.codigo);else if(p==='{n}'||p==='{n4}')re+='0*(\\d+)';else if(p==='{año}')re+='\\d{4}';else if(p==='{aa}')re+='\\d{2}';else re+=reEsc(p)}const m=new RegExp('^'+re+'$').exec(String(numero).trim());return m?+m[1]:null}
function esUltimo(doc){const s=D.config.series.find(x=>x.id===doc.serieId);if(!s)return false;const mx=listaDe(doc.tipo).filter(x=>x.serieId===s.id&&(!usaAnio(s)||x.anio===doc.anio)).reduce((m,x)=>Math.max(m,x.seq||0),0);return doc.seq===mx}

function modal({title,body,wide,actions=[{label:'Cerrar'}],onOpen}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="mdl ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h3>${esc(title)}</h3><button class="x" aria-label="Cerrar">×</button></div><div class="mb">${body}</div><div class="mf"></div></div>`;
  const close=()=>{ov.remove();if(m.onClose)m.onClose()};const m={ov,close};
  ov.querySelector('.x').onclick=close;
  const mf=ov.querySelector('.mf');
  for(const a of actions){const b=document.createElement('button');b.textContent=a.label;if(a.cls)b.className=a.cls;
    b.onclick=async()=>{if(a.fn){b.disabled=true;let r;try{r=await a.fn(ov)}catch(err){console.error(err);toast('Error: '+err.message);r=false}b.disabled=false;if(r===false)return}close()};mf.appendChild(b)}
  document.body.appendChild(ov);if(onOpen)onOpen(ov);
  const f=ov.querySelector('.mb input:not([disabled]):not([type=radio]):not([type=checkbox]):not([type=hidden]),.mb textarea');if(f)f.focus();
  return m}
function confirmar(msg,ok='Aceptar',cls='primary'){return new Promise(res=>{let done=false;
  const m=modal({title:'Confirmar',body:`<p style="margin:0">${msg}</p>`,actions:[{label:'Cancelar',fn:()=>{done=true;res(false)}},{label:ok,cls,fn:()=>{done=true;res(true)}}]});
  m.onClose=()=>{if(!done)res(false)}})}

const PCOLS=[{k:'codigo',l:'Código'},{k:'nombre',l:'Paciente'},{k:'compania',l:'Compañía aseguradora'},{k:'tel',l:'Teléfono'},{k:'tel2',l:'Teléfono 2'}];
const pv={codigo:p=>p.codigo,nombre:p=>p.nombre||'',compania:p=>p.compania||'',tratamiento:p=>p.tratamiento||'',poblacion:p=>[p.poblacion,p.cp].filter(Boolean).join(' '),tel:p=>p.movil1||p.fijo||p.movil2||'',tel2:p=>p.movil1?(p.movil2||p.fijo||''):(p.fijo&&p.movil2?p.movil2:'')};
function textoPac(p){return norm([p.codigo,p.nombre,p.dni,p.email,p.direccion,p.cp,p.poblacion,p.compania,p.poliza,p.tratamiento,p.alergias,p.notas,p.fnac&&fdate(p.fnac)].join(' '))}
function buscarPacientes(q,f){
  const terms=norm(q).trim().split(/\s+/).filter(Boolean);
  return D.pacientes.filter(p=>{
    if(terms.length){const h=textoPac(p),tel=compact([p.movil1,p.movil2,p.fijo].join(' '));
      if(!terms.every(t=>h.includes(t)||(/\d/.test(t)&&compact(t).length>2&&tel.includes(compact(t)))))return false}
    if(f){for(const c of PCOLS){const v=(f[c.k]||'').trim();if(!v)continue;
      if(c.k==='codigo'){if(!String(p.codigo).startsWith(v))return false}
      else if(c.k==='tel'||c.k==='tel2'){if(!compact(pv[c.k](p)).includes(compact(v)))return false}
      else if(!norm(pv[c.k](p)).includes(norm(v)))return false}}
    return true})}
function vPacientes(){
  return avisoCopia()+`<div class="bar"><div class="search">${ico('search',18)}<input id="gq" type="search" placeholder="Buscar en todos los campos: nombre, código, DNI, teléfono, email, dirección, población, compañía…" value="${esc(S.q)}" autocomplete="off"></div><button class="primary" data-act="nav" data-view="nuevoPaciente">+ Nuevo paciente</button></div>
  <div class="card p0"><table class="list"><thead><tr>${PCOLS.map(c=>`<th class="sortable" data-act="sort" data-k="${c.k}">${c.l}${S.sort.k===c.k?(S.sort.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>
  <tr class="filters">${PCOLS.map(c=>`<th><input data-f="${c.k}" value="${esc(S.f[c.k])}" placeholder="Filtrar" aria-label="Filtrar ${c.l}"></th>`).join('')}</tr></thead><tbody id="ptb"></tbody></table></div>
  <div class="bar" id="ppag"></div>`}
function pintarPacientes(){const tb=$('#ptb');if(!tb)return;
  const k=S.sort.k,dir=S.sort.dir;
  const L=buscarPacientes(S.q,S.f).sort((a,b)=>k==='codigo'?(a.codigo-b.codigo)*dir:(norm(pv[k](a)).localeCompare(norm(pv[k](b)))||norm(a.nombre).localeCompare(norm(b.nombre)))*dir);
  S.lastList=L.map(p=>p.id);
  const PS=100,pages=Math.max(1,Math.ceil(L.length/PS));if(S.page>=pages)S.page=pages-1;const vis=L.slice(S.page*PS,S.page*PS+PS);
  tb.innerHTML=vis.length?vis.map(p=>`<tr class="click" data-act="abrirPaciente" data-id="${p.id}"><td>${p.codigo}</td><td><b>${esc(UP(p.nombre))}</b>${p.alergias?' <span class="tag bad" title="Alergias: '+esc(p.alergias)+'">⚠</span>':''}</td><td>${esc(p.compania||'')}</td><td class="nowrap">${esc(pv.tel(p))}</td><td class="nowrap">${esc(pv.tel2(p))}</td></tr>`).join('')
    :`<tr><td colspan="5"><div class="empty">${D.pacientes.length?'No hay pacientes que coincidan.':'Aún no hay pacientes. Pulsa “+ Nuevo paciente”.'}</div></td></tr>`;
  $('#ppag').innerHTML=`<span class="mut sm">${L.length} de ${D.pacientes.length} pacientes</span><span class="grow"></span>${pages>1?`<button class="sm" data-act="pag" data-d="-1" ${S.page?'':'disabled'}>‹ Anterior</button><span class="sm">Página ${S.page+1} de ${pages}</span><button class="sm" data-act="pag" data-d="1" ${S.page<pages-1?'':'disabled'}>Siguiente ›</button>`:''}`}

  </tbody></table><div class="bar" style="margin:8px 10px"><button class="sm" data-act="printSel" data-s="${F?'facturas':'recibos'}">Imprimir selección</button></div>`:`<div class="empty">Sin ${F?'facturas':'recibos'}.</div>`}</div>
  <form class="card" data-form="crearDoc" data-tipo="${tipo}" id="fdoc"><h3>${F?'Crear factura':'Crear recibo'}</h3>
  <div class="grid"><label class="span2">Servicio<select name="servicioId"><option value="">Selecciona un servicio</option>${D.config.servicios.map(s=>`<option value="${s.id}">${esc(s.nombre)}${s.precio?' — '+eur(s.precio):''}</option>`).join('')}<option value="otro">Otro concepto…</option></select></label>
  <label class="span2">Cabecera<select name="cabeceraId">${cabOpts()}</select></label>
  <label class="span2" id="conceptoL" hidden>Concepto<input name="concepto" value="${esc(pre?pre.concepto:'')}"></label>
  <label class="full">Descripción<textarea name="descripcion" rows="2">${esc(pre?pre.descripcion:'')}</textarea></label>
  <label>Fecha<input type="date" name="fecha" value="${hoy()}" required></label><label>Serie<select name="serieId">${series.map(s=>`<option value="${s.id}">${esc(s.nombre)}</option>`).join('')}</select></label>
  <label>Nº ${F?'factura':'recibo'}<input name="numero" required></label><label>Forma de pago<select name="formaPago">${optList(PAGOS,pre?pre.formaPago:'Tarjeta')}</select></label>
  ${!F?`<label class="span2">Corresponde a factura<select name="facturaId"><option value="">— Ninguna —</option>${facs.map(f=>`<option value="${f.id}" ${pre&&pre.id===f.id?'selected':''}>${esc(f.numero)} · ${fdate(f.fecha)} · ${eur(f.total)}</option>`).join('')}</select></label>`:''}
  </div>
  <div class="calc" style="margin-top:12px"><label>Precio base<input name="base" class="num" data-calc="base" inputmode="decimal" value="${pre?n2(pre.base):''}"></label><label>IVA (%)<select name="iva" data-calc="iva">${IVAS.map(x=>`<option value="${x}" ${(pre?pre.iva:0)===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Total IVA<input name="cuota" class="num" readonly tabindex="-1" value="${pre?n2(pre.cuota):''}"></label><label>Precio total<input name="total" class="num" data-calc="total" inputmode="decimal" value="${pre?n2(pre.total):''}" style="font-weight:700"></label>
  ${F?'<label class="row" style="padding-bottom:8px"><input type="checkbox" name="pagada" checked> Cobrada</label>':'<span></span>'}</div>

  ${F?'<label class="row" style="margin-top:10px"><input type="checkbox" name="conRecibo"> Crear también el recibo</label>':''}
  <div class="bar" style="margin:12px 0 0"><button class="primary" name="print" value="1">${F?'Crear factura':'Crear recibo'} e imprimir</button><button>Solo guardar</button></div></form>`}
function initDocForm(){const f=$('#fdoc');if(!f)return;actualizarNumero(f);if(S.prefillRecibo){S.prefillRecibo=null;f.dataset.last='total';f.scrollIntoView({behavior:'smooth'})}}
function actualizarNumero(f){if(f.numero.dataset.manual)return;const s=D.config.series.find(x=>x.id===f.serieId.value);f.numero.value=s?siguiente(s,f.fecha.value).numero:''}
function calcDoc(f,src){const iva=+f.iva.value;if(src==='base'||src==='total')f.dataset.last=src;const last=f.dataset.last||'total';
  if(last==='base'){const b=pnum(f.base.value);const t=r2(b*(1+iva/100));if(src!=='base')f.base.value=f.base.value?n2(b):'';f.total.value=f.base.value?n2(t):'';f.cuota.value=f.base.value?n2(t-b):''}
  else{const t=pnum(f.total.value);const b=r2(t/(1+iva/100));f.base.value=f.total.value?n2(b):'';f.cuota.value=f.total.value?n2(r2(t-b)):''}}

  <div style="margin-top:10px"><div class="toolbar"><button type="button" data-cmd="bold"><b>N</b></button><button type="button" data-cmd="italic"><i>K</i></button><button type="button" data-cmd="underline"><u>S</u></button><button type="button" data-cmd="insertUnorderedList">• Lista</button><button type="button" data-cmd="h">Título</button>${micBtn('#infEd','Dictar','sm')}<button type="button" data-act="iaInf">✨ Redactar con IA</button><span class="grow"></span><button type="button" data-act="infUltima">Insertar última visita</button><button type="button" data-act="infAnt">Insertar alergias</button></div>
  <div class="editor" id="infEd" contenteditable="true">${ed?ed.html:''}</div></div>

  <div class="prevwrap"><div class="bar" style="margin-bottom:8px"><b class="sm">Vista previa</b><span class="mut sm">se actualiza mientras escribes o dictas</span></div><iframe id="infPrev" title="Vista previa del informe"></iframe></div></div>`}

const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let DIC=null;
function micBtn(target,label='Dictar',cls='',modo='texto'){return `<button type="button" class="mic ${cls}" data-act="dictar" data-target="${target}" data-modo="${modo}" title="Dictar por voz (Chrome o Edge)">🎤 ${label}</button>`}
function limpiarDictado(t,abrev=true){let s=' '+t.trim()+' ';
  const R=[[/\s*\b(punto y aparte|nuevo párrafo)\b\s*/gi,'.\n'],[/\s*\b(nueva línea|siguiente línea|salto de línea)\b\s*/gi,'\n'],[/\s*\b(punto y seguido|punto)\b\s*/gi,'. '],[/\s*\bdos puntos\b\s*/gi,': '],[/\s*\bpunto y coma\b\s*/gi,'; '],[/\s*\bcoma\b\s*/gi,', '],
    [/\s*\babrir paréntesis\b\s*/gi,' ('],[/\s*\bcerrar paréntesis\b\s*/gi,') '],[/\bmás\s+(?=\d)/gi,'+'],[/\bmenos\s+(?=\d)/gi,'-'],[/(\d)\.(\d)/g,'$1,$2']];
  if(abrev)R.push([/ojo derecho/gi,'OD'],[/ojo izquierdo/gi,'OI'],[/ambos ojos/gi,'AO']);
  for(const[a,b]of R)s=s.replace(a,b);
  return s.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').replace(/ {2,}/g,' ').replace(/\s+([.,:;)])/g,'$1').trim()}
function capInicio(s,prev){if(!prev||/[.\n]\s*$/.test(prev))s=s.charAt(0).toLocaleUpperCase('es-ES')+s.slice(1);return s.replace(/([.\n]\s*)([a-záéíóúñ])/g,(m,a,b)=>a+b.toLocaleUpperCase('es-ES'))}
function insertarDictado(el,txt){txt=limpiarDictado(txt,!el.isContentEditable);if(!txt)return;
  if(el.isContentEditable){el.focus();const prev=el.textContent;txt=capInicio(txt,prev);const sp=prev&&!/\s$/.test(prev)&&!/^[.,:;\n]/.test(txt)?' ':'';
    if(txt.includes('\n')){txt.split('\n').forEach((part,i)=>{if(i)document.execCommand('insertParagraph');if(part)document.execCommand('insertText',false,(i?'':sp)+part)})}else document.execCommand('insertText',false,sp+txt);schedPreview();return}
  const s=el.selectionStart??el.value.length,e=el.selectionEnd??s,pre=el.value.slice(0,s);txt=capInicio(txt,pre);
  const sp=pre&&!/\s$/.test(pre)&&!/^[.,:;\n]/.test(txt)?' ':'';el.value=pre+sp+txt+el.value.slice(e);const pos=(pre+sp+txt).length;el.setSelectionRange(pos,pos);el.dispatchEvent(new Event('input',{bubbles:true}))}
const fmtDiop=v=>{const n=pnum(v);return (n>0?'+':n<0?'-':'')+Math.abs(n).toFixed(2).replace('.',',')};
function parseGafas(txt,st,f){
  let t=norm(txt).replace(/(\d)\s*,\s*(\d)/g,'$1.$2').replace(/(\d) coma (\d)/g,'$1.$2').replace(/\bmas\s+(?=\d)/g,'+').replace(/\bmenos\s+(?=\d)/g,'-').replace(/\bneutro\b/g,'0').replace(/\bcero\b/g,'0').replace(/[,;:]/g,' ');
  const tk=t.split(/\s+/).filter(Boolean);const KW={esf:['esfera','esferico','esf'],cil:['cilindro','cil'],eje:['eje','a','x','por'],av:['agudeza','av','vision'],add:['adicion','add','cerca'],dip:['dip','distancia','interpupilar']};
  const kwOf=w=>Object.keys(KW).find(k=>KW[k].includes(w));const set=(eye,campo,val)=>{const eyes=eye==='ao'?['od','oi']:[eye];for(const e of eyes){const n=campo==='add'?'add.'+e:e+'.'+campo;const el=f.querySelector(`[name="${n}"]`);if(el){el.value=val;st.n++}}};
  const out=[];
  for(let i=0;i<tk.length;i++){const w=tk[i];
    if(w==='observaciones'||w==='observacion'){const r=txt.split(/observaci[oó]n(es)?/i).pop().replace(/^[\s:,]+/,'');f.obs.value=(f.obs.value?f.obs.value+' ':'')+r.trim();st.n++;break}
    if(['od','derecho','dcho'].includes(w)){st.eye='od';st.campo=null;st.ultimo=null;continue}
    if(['oi','izquierdo','izdo'].includes(w)){st.eye='oi';st.campo=null;st.ultimo=null;continue}
    if(w==='ambos'||w==='ao'){st.eye='ao';st.campo=null;st.ultimo=null;continue}
    if(w==='progresivo'||w==='progresivos'){f.tipo.value='Progresivo';st.n++;continue}
    if(w==='bifocal'||w==='bifocales'){f.tipo.value='Bifocal';st.n++;continue}
    if(w==='ocupacional'){f.tipo.value='Ocupacional';st.n++;continue}
    if(w==='monofocal'){f.tipo.value=tk.slice(i,i+4).includes('cerca')?'Monofocal cerca':'Monofocal lejos';st.n++;continue}
    const k=kwOf(w);if(k){st.campo=k;continue}
    let m=/^([+-]?)(\d+(?:\.\d+)?)$/.exec(w);
    if(m){let num=m[2];const sign=m[1];
      if(!num.includes('.')&&+num<=20&&/^(00|25|50|75)$/.test(tk[i+1]||'')){num=num+'.'+tk[i+1];i++}
      let campo=st.campo;if(!campo){campo=st.ultimo==='esf'?'cil':st.ultimo==='cil'?'eje':'esf'}
      if(campo==='dip'){f.dip.value=String(Math.round(+num));st.n++;st.campo=null;continue}
      if(!st.eye){continue}
      let v;if(campo==='eje')v=String(Math.round(+num));else if(campo==='av')v=String(num).replace('.',',');
      else{let n=+num;if(!num.includes('.')&&n>=25&&n%25===0&&n<=2000)n=n/100;v=fmtDiop((sign==='-'?-1:1)*n)}
      set(st.eye,campo,v);if(campo==='add'&&st.eye!=='ao'){const o=f.querySelector(`[name="add.${st.eye==='od'?'oi':'od'}"]`);if(o&&!o.value)o.value=v}st.ultimo=campo;st.campo=null;continue}
    out.push(w)}
  return st}
function pararDictado(){if(!DIC)return;const d=DIC;DIC=null;try{d.rec.stop()}catch(e){}if(d.btn&&d.btn.isConnected){d.btn.classList.remove('on');d.btn.innerHTML=d.btnHTML}const b=$('#dicbar');if(b)b.remove();
  if(!d.dictado||!d.target.isConnected)return;const ia=D.config.ia;
  if(d.modo==='gafas'){const f=d.target;d.parado=true;botonDeshacer($('[data-act=iaGafas]'),()=>{ponerGafas(f,d.base);$('#gdudas').textContent=''});
    if(iaGafasOn()){clearTimeout(d.t);gafasTick(d);toast('Graduación dictada: revisa los valores antes de guardar')}else toast(d.st.n?'Graduación dictada: revisa los valores (sin IA configurada)':'No se ha entendido el dictado; configura la IA para mejor resultado')}
  else if(d.target.id==='htxt'&&ia.key&&ia.historial)iaHist();
  else if(d.target.id==='infEd'&&ia.key&&ia.informes)iaInf()}
function dictar(d,btn){if(DIC){const same=DIC.btn===btn;pararDictado();if(same)return}
  if(!SRec){modal({title:'Dictado no disponible',body:'<p style="margin-top:0">Este navegador no permite el dictado integrado. Usa <b>Google Chrome</b> o <b>Microsoft Edge</b>.</p><p>Alternativa en Windows: haz clic en el cuadro de texto y pulsa <b>tecla Windows + H</b> para usar el dictado de Windows.</p>'});return}
  const target=d.modo==='gafas'?$(d.target):$(d.target);if(!target){toast('No se encuentra el campo');return}
  const rec=new SRec();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;
  DIC={rec,btn,btnHTML:btn.innerHTML,target,modo:d.modo,st:{eye:null,campo:null,ultimo:null,n:0}};
  btn.classList.add('on');btn.innerHTML='■ Detener';
  const bar=document.createElement('div');bar.className='dicbar';bar.id='dicbar';bar.innerHTML=`<span class="dot"></span><span class="txt" id="dictxt">Escuchando… habla con normalidad${d.modo==='gafas'?'':' (di “punto”, “coma”, “punto y aparte”)'}</span><button class="sm" data-act="pararDictado">Detener</button>`;document.body.appendChild(bar);
  if(!target.isContentEditable&&d.modo!=='gafas'){target.focus();target.setSelectionRange(target.value.length,target.value.length)}else if(target.isContentEditable){target.focus();const r=document.createRange();r.selectNodeContents(target);r.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
  const cur=DIC;if(d.modo==='gafas'){cur.base=leerGafas(target);cur.seq=0}
  rec.onresult=ev=>{if(DIC!==cur)return;let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal){const tx=r[0].transcript;cur.dictado=true;if(cur.modo==='gafas'){const g=$('#gdict');if(g){g.value=(g.value?g.value.trim()+' ':'')+tx.trim()}gafasLive(cur,tx)}else insertarDictado(cur.target,tx)}else interim+=r[0].transcript}
    const el=$('#dictxt');if(el&&!(cur.busy&&!interim))el.textContent=interim||'Escuchando…'};
  rec.onerror=ev=>{if(DIC!==cur)return;const M={'not-allowed':'Permiso de micrófono denegado. Permítelo en el icono del candado/cámara de la barra de direcciones.','service-not-allowed':'El navegador no permite el dictado en esta página.','network':'El dictado necesita conexión a internet.','audio-capture':'No se detecta ningún micrófono.'};if(M[ev.error]){toast(M[ev.error]);pararDictado()}};
  rec.onend=()=>{if(DIC===cur){try{rec.start()}catch(e){pararDictado()}}};
  try{rec.start()}catch(e){toast('No se pudo iniciar el dictado: '+e.message);pararDictado()}}

/* ================= inteligencia artificial (Claude) ================= */
async function claude({system,user,tool,max_tokens=1500}){const c=D.config.ia;if(!c.key)throw new Error('SIN_CLAVE');
  const body={model:c.modelo||'claude-haiku-5-5',max_tokens,system,messages:[{role:'user',content:user}]};
  if(tool){body.tools=[tool];body.tool_choice={type:'tool',name:tool.name}}
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  catch(e){throw new Error('Sin conexión con la IA. Comprueba internet.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||('error '+r.status);throw new Error(r.status===401?'La clave de la API no es válida':r.status===429?'Demasiadas peticiones; espera unos segundos':/credit|balance/i.test(m)?'Sin saldo en la cuenta de la API (console.anthropic.com → Billing)':m)}
  if(tool){const b=(j.content||[]).find(x=>x.type==='tool_use');if(!b)throw new Error('Respuesta inesperada de la IA');return b.input}
  return (j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('').trim()}
function sinClave(){modal({title:'Falta configurar la IA',body:'<p style="margin-top:0">Para usar la inteligencia artificial hay que pegar una clave de la API de Anthropic en <b>Configuración → Inteligencia artificial</b>. Allí se explica cómo conseguirla.</p>',actions:[{label:'Cerrar'},{label:'Ir a configuración',cls:'primary',fn:()=>{S.cfg='ia';go('config')}}]})}
async function conIA(btn,fn){if(!D.config.ia.key){sinClave();return}const b=btn&&btn.isConnected?btn:null;const old=b&&b.innerHTML;if(b){b.disabled=true;b.innerHTML='✨ Pensando…'}
  try{await fn()}catch(e){if(e.message==='SIN_CLAVE')sinClave();else toast('IA: '+e.message)}finally{if(b&&b.isConnected){b.disabled=false;b.innerHTML=old}}}
function botonDeshacer(trasBtn,fn){$$('[data-act=deshacerIA]').forEach(x=>x.remove());if(!trasBtn||!trasBtn.isConnected)return;const u=document.createElement('button');u.type='button';u.className='sm';u.dataset.act='deshacerIA';u.textContent='↶ Deshacer IA';trasBtn.after(u);S.undoIA=fn}

const SYS_GAFAS=`Eres el asistente de un oftalmólogo en España. Recibes el texto de un dictado por voz (puede tener errores de reconocimiento) con una prescripción de gafas, y los valores que ya hay en el formulario. Rellena el formulario con la herramienta.
Reglas:
- OD = ojo derecho ("derecho", "el derecho"); OI = ojo izquierdo. "Ambos" o "AO" = los dos ojos.
- Esfera, cilindro y adición: con signo y dos decimales con coma: "+1,25", "-0,50", "+2,00". Interpreta formas habladas: "menos uno veinticinco" = -1,25; "menos cero cincuenta" o "menos cincuenta" (en cilindro) = -0,50; "uno y cuarto" = 1,25; "uno y medio" = 1,50; "tres cuartos" = 0,75; "neutro" o "plano" = "0,00". Si no se dice el signo de la esfera, pon "+".
- Eje: número entero 0-180 sin símbolo ("a noventa", "por 90", "eje 90" = "90").
- Orden habitual sin palabras clave: esfera, cilindro, eje. Ej.: "derecho menos dos menos cincuenta a ciento ochenta" = esf -2,00, cil -0,50, eje 180.
- AV: tal como se dicte, decimal con coma ("uno" = "1,0", "cero coma ocho" = "0,8").
- Adición: si se dice una sola vez sin ojo, es para los dos.
- DIP: número en mm.
- Tipo: uno de la lista o vacío.
- Parte de los valores actuales y modifica solo lo que el dictado cambia ("cambia el eje del izquierdo a 85"). Si un campo no se menciona, devuelve el valor actual.
- No inventes valores. Si algo es ambiguo o incoherente (p. ej. eje sin cilindro), anótalo en "dudas".`;
const T_OJO={type:'object',properties:{esf:{type:'string'},cil:{type:'string'},eje:{type:'string'},av:{type:'string'}}};
const TOOL_GAFAS={name:'rellenar_gafas',description:'Rellena el formulario de receta de gafas',input_schema:{type:'object',properties:{od:T_OJO,oi:T_OJO,add_od:{type:'string'},add_oi:{type:'string'},dip:{type:'string'},tipo:{type:'string',enum:['',...TIPOS_GAFA]},obs:{type:'string',description:'Observaciones para la óptica (tratamientos, filtros…)'},dudas:{type:'string',description:'Lo que no se ha entendido o parece incoherente; vacío si todo está claro'}},required:['od','oi']}};
const CAMPOS_G=['od.esf','od.cil','od.eje','od.av','oi.esf','oi.cil','oi.eje','oi.av','add.od','add.oi','dip','tipo','obs'];
function leerGafas(f){const o={};CAMPOS_G.forEach(n=>{const el=f.querySelector(`[name="${n}"]`);o[n]=el?el.value:''});return o}
function ponerGafas(f,o){CAMPOS_G.forEach(n=>{const el=f.querySelector(`[name="${n}"]`);if(el&&o[n]!=null)el.value=o[n]})}
async function pedirGafas(base,txt){
  const actual={od:{esf:base['od.esf'],cil:base['od.cil'],eje:base['od.eje'],av:base['od.av']},oi:{esf:base['oi.esf'],cil:base['oi.cil'],eje:base['oi.eje'],av:base['oi.av']},add_od:base['add.od'],add_oi:base['add.oi'],dip:base.dip,tipo:base.tipo,obs:base.obs};
  const r=await claude({system:SYS_GAFAS,tool:TOOL_GAFAS,max_tokens:800,user:`Valores actuales del formulario:\n${JSON.stringify(actual)}\n\nTipos de lente posibles: ${TIPOS_GAFA.join(', ')}\n\nDictado (puede estar incompleto porque el médico sigue hablando; rellena lo que ya se haya dicho):\n«${txt}»`});
  const n={};['od','oi'].forEach(e=>{const x=r[e]||{};['esf','cil','eje','av'].forEach(k=>{if(x[k]!=null)n[e+'.'+k]=String(x[k])})});
  if(r.add_od!=null)n['add.od']=r.add_od;if(r.add_oi!=null)n['add.oi']=r.add_oi;['dip','tipo','obs'].forEach(k=>{if(r[k]!=null)n[k]=r[k]});
  return{n,dudas:r.dudas||''}}
function ponerGafasFlash(f,n){CAMPOS_G.forEach(k=>{const el=f.querySelector(`[name="${k}"]`);if(el&&n[k]!=null&&el.value!==n[k]){el.value=n[k];el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}})}
async function iaGafas(btn){const f=$('#fgafas'),g=$('#gdict');if(!f||!g)return;const txt=g.value.trim();if(!txt){toast('No hay nada dictado ni escrito');return}
  btn=btn||$('[data-act=iaGafas]');
  await conIA(btn,async()=>{const prev=leerGafas(f);const{n,dudas}=await pedirGafas(prev,txt);
    if(!f.isConnected)return;ponerGafasFlash(f,n);$('#gdudas').textContent=dudas?'⚠ '+dudas:'';
    botonDeshacer(btn,()=>{ponerGafas(f,prev);$('#gdudas').textContent=''});toast('Casillas rellenadas por la IA: revísalas antes de guardar')})}
/* gafas en tiempo real: tras cada pausa del dictado se reinterpreta todo lo dicho desde los valores iniciales */
const iaGafasOn=()=>D.config.ia.key&&D.config.ia.gafas;
function gafasLive(cur,tx){if(iaGafasOn()){clearTimeout(cur.t);cur.t=setTimeout(()=>gafasTick(cur),350)}else parseGafas(tx,cur.st,cur.target)}
async function gafasTick(cur){const f=$('#fgafas'),g=$('#gdict');if(!f||!g)return;const txt=g.value.trim();if(!txt||txt===cur.enviado)return;
  if(cur.busy){cur.pend=true;return}cur.busy=true;cur.enviado=txt;const id=++cur.seq;estadoDic('✨ Rellenando casillas…');
  try{const{n,dudas}=await pedirGafas(cur.base,txt);if(f.isConnected&&id===cur.seq){ponerGafasFlash(f,n);$('#gdudas').textContent=dudas&&!DIC?'⚠ '+dudas:'';cur.dudas=dudas}}
  catch(e){if(e.message!=='SIN_CLAVE')toast('IA: '+e.message)}
  finally{cur.busy=false;estadoDic(null);if(cur.pend){cur.pend=false;gafasTick(cur)}else if(cur.parado&&f.isConnected){$('#gdudas').textContent=cur.dudas?'⚠ '+cur.dudas:''}}}
function estadoDic(t){const b=$('#dicbar .txt');if(b&&t)b.textContent=t}
function interpretarGafasLocal(){const f=$('#fgafas'),g=$('#gdict');if(!f||!g||!g.value.trim())return;const prev=leerGafas(f);const st=parseGafas(g.value,{eye:null,campo:null,ultimo:null,n:0},f);
  botonDeshacer($('[data-act=iaGafas]'),()=>ponerGafas(f,prev));toast(st.n?'Graduación dictada: revisa los valores (sin IA configurada)':'No se ha entendido el dictado; configura la IA para mejor resultado')}

const SYS_HIST=`Eres el asistente de un oftalmólogo en España. Recibes la anotación de una visita, dictada por voz (puede tener errores de reconocimiento) o escrita. Devuelve SOLO el texto final de la anotación, sin comentarios ni markdown, ordenado en el formato de la consulta: una sección por línea con estas etiquetas, en este orden, y solo las que tengan contenido:
MC: (motivo de consulta)
AP: (antecedentes)
AV sc: OD … OI …
AV cc: OD … OI …
PIO: OD … OI …
RX: OD … OI …
BMC: (biomicroscopía / polo anterior)
FO: (fondo de ojo)
PRUEBAS: (OCT, campimetría, topografía…)
JC: (juicio clínico)
PLAN: (tratamiento, recomendaciones, próxima revisión)
Reglas: usa OD/OI/AO; decimales con coma; dioptrías con signo y dos decimales (-1,25 -0,50 x 90º); PIO en números sin unidades. Corrige errores evidentes de dictado ("pío" → PIO, "o de" → OD, "fondo de ojos" → FO). No inventes ni añadas datos que no estén; no añadas secciones vacías. Si el texto ya tiene este formato, respétalo y solo integra lo nuevo. Lo que no encaje en ninguna sección déjalo al final tal cual. Mantén el estilo breve de una historia clínica.`;
async function iaHist(btn){const t=$('#eht')||$('#htxt');if(!t)return;const txt=t.value.trim();if(!txt){toast('No hay texto que ordenar');return}
  btn=btn||$('[data-act=iaHist]');
  await conIA(btn,async()=>{const prev=t.value;const r=await claude({system:SYS_HIST,user:txt,max_tokens:1500});if(!r)throw new Error('respuesta vacía');
    if(!t.isConnected)return;t.value=r;t.dispatchEvent(new Event('input',{bubbles:true}));botonDeshacer(btn,()=>{t.value=prev;t.dispatchEvent(new Event('input',{bubbles:true}))});toast('Anotación ordenada por la IA: revísala antes de insertar')})}

const SYS_INF=`Eres el asistente de un oftalmólogo en España. A partir de las notas (dictadas por voz, pueden tener errores de reconocimiento) redacta el cuerpo de un informe oftalmológico en español formal y claro.
Devuelve SOLO HTML con estas etiquetas: <p>, <b>, <i>, <ul>, <li>, <h3>, <br>. Sin <html>, sin estilos, sin markdown, sin comentarios.
No incluyas nombre, DNI ni datos del paciente, fecha, título del informe ni firma: el programa ya los añade. Empieza directamente por el contenido.
Organiza en apartados solo si hay contenido para ellos (p. ej. Motivo de consulta, Exploración, Pruebas complementarias, Diagnóstico, Tratamiento y recomendaciones). No inventes hallazgos, cifras ni recomendaciones que no estén en las notas.`;
function limpiarHTML(h){const doc=new DOMParser().parseFromString('<div>'+String(h).replace(/^\s*```(html)?/,'').replace(/```\s*$/,'')+'</div>','text/html');const OK=['P','B','STRONG','I','EM','U','UL','OL','LI','H3','H4','BR'];
  const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===1){if(['SCRIPT','STYLE','IFRAME','OBJECT','TEMPLATE'].includes(c.tagName)){c.remove();return}walk(c);if(!OK.includes(c.tagName))c.replaceWith(...c.childNodes);else[...c.attributes].forEach(a=>c.removeAttribute(a.name))}else if(c.nodeType!==3)c.remove()})};
  const root=doc.body.firstChild;walk(root);return root.innerHTML}
async function iaInf(btn){const ed=$('#infEd');if(!ed)return;const txt=ed.innerText.trim();if(!txt){toast('Dicta o escribe primero unas notas');return}
  btn=btn||$('[data-act=iaInf]');const f=$('#finf');
  await conIA(btn,async()=>{const prev=ed.innerHTML;const r=await claude({system:SYS_INF,user:`Título del informe: ${f?f.titulo.value:''}\n\nNotas:\n${txt}`,max_tokens:2500});
    if(!ed.isConnected)return;ed.innerHTML=limpiarHTML(r);schedPreview();botonDeshacer(btn,()=>{ed.innerHTML=prev;schedPreview()});toast('Informe redactado por la IA: revísalo antes de guardar')})}

  fbCrearClave:async f=>{const o=formObj(f);if(o.p1!==o.p2){pantallaAcceso('crearClave','Las dos claves no coinciden.');return}

      try{await fsCommit([{update:{name:docName('meta','cifrado'),fields:{salt:{stringValue:salt},iter:{integerValue:String(iter)},check:{stringValue:check}}},currentDocument:{exists:false}}])}
      catch(e){if(/exist|precondition/i.test(e.message)){NUBE.meta=await fsGet('meta','cifrado');pantallaAcceso('pedirClave','Ya existía una clave de cifrado en este proyecto: escríbela.');return}throw e}

  crearDoc:async(f,sub)=>{const tipo=f.dataset.tipo,F=tipo==='factura',store=F?'facturas':'recibos';const o=formObj(f);
    const srv=D.config.servicios.find(s=>s.id===o.servicioId);const concepto=srv?srv.nombre:o.concepto;
    if(!concepto&&!o.descripcion){toast('Elige un servicio o escribe la descripción');return}

  guardarCab:async f=>{const h=D.config.cabeceras.find(c=>c.id===f.dataset.id);Object.assign(h,formObj(f));await guardarCfg();render();toast('Cabecera guardada')},
  guardarLista:async f=>{const k=f.dataset.k;D.config[k]=[...new Set(f.v.value.split('\n').map(s=>k==='textosRapidos'?s.replace(/\s+$/,' ').replace(/^\s+/,''):s.trim()).filter(s=>s.trim()))];await guardarCfg();render();toast('Guardado')},
  guardarIA:async f=>{const o=formObj(f);const c=D.config.ia;if(o.key)c.key=o.key;c.modelo=o.modelo;c.gafas=!!o.gafas;c.historial=!!o.historial;c.informes=!!o.informes;await guardarCfg();render();toast('Configuración de IA guardada')},
  guardarUsuario:async f=>{const o=formObj(f);if(o.pw&&o.pw!==o.pw2){toast('Las contraseñas no coinciden');return}
    if(o.pw){try{const j=await authPost('update',{idToken:await token(),password:o.pw,returnSecureToken:true});if(j.idToken){NUBE.auth.idt=j.idToken;NUBE.auth.rt=j.refreshToken||NUBE.auth.rt;ss.set('cl_auth',NUBE.auth)}}catch(e){toast(e.message);return}}
    const u=D.config.usuarios.find(x=>x.id===yo().id);if(u)u.nombre=o.nombre;await guardarCfg();asegurarUsuario();render();toast(o.pw?'Nombre y contraseña guardados':'Guardado')},
  guardarGeneral:async f=>{const o=formObj(f);Object.assign(D.config,o,{minutosBloqueo:Math.max(1,parseInt(o.minutosBloqueo)||30),ultimasN:Math.max(1,parseInt(o.ultimasN)||3)});await guardarCfg();render();toast('Guardado')},
};

/* ================= exportar / copia ================= */
function exportCSV(o){const en=x=>(!o.desde||x.fecha>=o.desde)&&(!o.hasta||x.fecha<=o.hasta);const nm=id=>{const p=pac(id);return p?[p.codigo,UP(p.nombre)]:['',''];};const n=v=>String(r2(v)).replace('.',',');let rows;
  switch(o.que){
    case'pacientes':rows=[['Código','Nombre','DNI','Fecha nac.','Fijo','Móvil 1','Móvil 2','Email','Dirección','C.P.','Población','Compañía','Póliza','Tratamiento','Alergias','Alta']].concat([...D.pacientes].sort((a,b)=>a.codigo-b.codigo).map(p=>[p.codigo,UP(p.nombre),p.dni,fdate(p.fnac),p.fijo,p.movil1,p.movil2,p.email,p.direccion,p.cp,p.poblacion,p.compania,p.poliza,p.tratamiento,p.alergias,fdate(new Date(p.creado).toISOString())]));break;
    case'facturas':case'recibos':rows=[['Número','Fecha','Nº paciente','Paciente','Cliente','NIF','Concepto','Descripción','Base','IVA %','Cuota IVA','Total','Forma de pago','Estado']].concat(D[o.que].filter(en).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(d=>[d.numero,fdate(d.fecha),...nm(d.pacienteId),d.cliente&&d.cliente.nombre,d.cliente&&d.cliente.dni,d.concepto,d.descripcion,n(d.base),d.iva,n(d.cuota),n(d.total),d.formaPago,d.estado==='anulada'?'Anulada':d.tipo==='factura'?(d.pagada?'Cobrada':'Pendiente'):'Emitido']));break;
    case'citas':rows=[['Fecha','Hora','Duración','Nº paciente','Paciente','Teléfono','Motivo','Estado']].concat(D.citas.filter(en).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).map(c=>{const p=pac(c.pacienteId);return[fdate(c.fecha),c.hora,c.duracion,p?p.codigo:'',p?UP(p.nombre):c.nombreLibre,p?telP(p):c.telLibre,c.motivo,c.estado]}));break;
    case'historial':rows=[['Fecha','Nº paciente','Paciente','Texto','Autor']].concat(D.historial.filter(en).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(e=>[fdate(e.fecha),...nm(e.pacienteId),e.texto,autorDe(e.autor)]));break;
    case'gafas':rows=[['Fecha','Nº paciente','Paciente','OD esf','OD cil','OD eje','OI esf','OI cil','OI eje','Add OD','Add OI','DIP','Tipo']].concat(D.gafas.filter(en).map(g=>[fdate(g.fecha),...nm(g.pacienteId),g.od&&g.od.esf,g.od&&g.od.cil,g.od&&g.od.eje,g.oi&&g.oi.esf,g.oi&&g.oi.cil,g.oi&&g.oi.eje,g.add&&g.add.od,g.add&&g.add.oi,g.dip,g.tipo]));break;
    case'recetas':rows=[['Fecha','Nº paciente','Paciente','Medicamento','Posología','Duración']].concat(D.recetas.filter(en).flatMap(r=>r.items.map(i=>[fdate(r.fecha),...nm(r.pacienteId),i.med,i.pos,i.dur])));break;
  }
  if(rows.length<2){toast('No hay datos en ese periodo');return}
  descargar(`${o.que}-${o.que==='pacientes'?hoy():o.desde+'_'+o.hasta}.csv`,csv(rows),'text/csv;charset=utf-8');toast(`${rows.length-1} filas exportadas`)}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function exportar(){const conF=!!($('#bkFiles')||{}).checked||(!$('#bkFiles')&&D.archivos.length>0);
  D.config.ultimaCopia=Date.now();await guardarCfg();
  const data={app:'gestion-clinica-oftalmologica',version:2,exportado:new Date().toISOString(),config:{...D.config,ia:{...D.config.ia,key:''}}};DATA.forEach(s=>data[s]=D[s]);
  if(conF){data.blobs=[];for(const a of D.archivos){const b=await getBlob(a.id);if(b)data.blobs.push({id:a.id,data:await blobToData(b)})}}
  descargar(`copia-clinica-${hoy()}.json`,JSON.stringify(data),'application/json');toast('Copia descargada');render()}
async function restaurarLocalAntiguo(data){
  const usuarios=(data.config&&data.config.usuarios&&data.config.usuarios.length)?data.config.usuarios:D.config.usuarios;
  const cfg=mergeCfg({...data.config,usuarios});cfg.ia.key=cfg.ia.key||(D.config.ia&&D.config.ia.key)||'';
  const blobs=[];for(const b of data.blobs||[]){blobs.push({id:b.id,blob:await (await fetch(b.data)).blob()})}
  await new Promise((res,rej)=>{const t=db.transaction(STORES,'readwrite');
    for(const s of STORES){const os=t.objectStore(s);os.clear();const items=s==='config'?[cfg]:s==='blobs'?blobs:(data[s]||[]);items.forEach(x=>x&&x.id&&os.put(x))}
    t.oncomplete=res;t.onerror=()=>rej(t.error)});
  await cargarTodo()}

/* ================= eventos ================= */
document.addEventListener('click',e=>{const cmd=e.target.closest('[data-cmd]');if(cmd){e.preventDefault();const c=cmd.dataset.cmd;$('#infEd').focus();if(c==='h')document.execCommand('formatBlock',false,'h3');else document.execCommand(c);schedPreview();return}
  const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el.dataset,el,e)});
document.addEventListener('submit',e=>{const f=e.target;const h=FORM[f.dataset.form];if(!h)return;e.preventDefault();const sub=e.submitter&&e.submitter.name==='print';
  const bt=$$('button',f);bt.forEach(b=>b.disabled=true);Promise.resolve(h(f,sub)).catch(err=>{console.error(err);toast('Error: '+err.message)}).finally(()=>bt.forEach(b=>b.isConnected&&(b.disabled=false)))});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='infEd'||(t.form&&t.form.id==='finf'))schedPreview();
  if(t.id==='gq'){S.q=t.value;S.page=0;pintarPacientes()}
  else if(t.dataset.f!==undefined&&t.closest('tr.filters')){S.f[t.dataset.f]=t.value;S.page=0;pintarPacientes()}
  else if(t.id==='htxt')S.drafts[S.pid]=t.value;
  else if(t.dataset.calc==='base'||t.dataset.calc==='total')calcDoc(t.form,t.dataset.calc);
  else if(t.name==='numero'&&t.form&&t.form.id==='fdoc')t.dataset.manual=t.value?'1':'';
  else if(t.id==='hq'){S.hq=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#hq');n.focus();n.setSelectionRange(pos,pos)},250)}
  else if(t.id==='pkq'){const box=t.parentElement.querySelector('#pkres');const q=t.value.trim();if(q.length<2){box.hidden=true;return}const L=buscarPacientes(q).slice(0,8);box.hidden=false;box.innerHTML=L.length?L.map(p=>`<div data-act="pickPac" data-id="${p.id}"><b>${esc(UP(p.nombre))}</b> <span class="mut">Nº ${p.codigo} · ${esc(telP(p))}</span></div>`).join(''):'<div class="mut">Sin coincidencias</div>'}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.form&&t.form.id==='finf'){schedPreview();return}
  if(t.id==='hdesde'||t.id==='hhasta'){S[t.id]=t.value;render()}
  else if(t.id==='agFecha'&&t.value){S.agenda=t.value;render()}
  else if(t.dataset.cita){const c=D.citas.find(x=>x.id===t.dataset.cita);c.estado=t.value;guardar('citas',c).then(()=>render())}
  else if(t.form&&t.form.id==='fdoc'){const f=t.form;
    if(t.name==='servicioId'){const s=D.config.servicios.find(x=>x.id===t.value);$('#conceptoL').hidden=t.value!=='otro';if(s){f.iva.value=s.iva;if(s.precio){f.total.value=n2(s.precio);calcDoc(f,'total')}else{f.total.value='';f.base.value='';f.cuota.value='';f.total.focus()}}}
    if(t.name==='iva')calcDoc(f,'iva');
    if(t.name==='serieId'||t.name==='fecha')actualizarNumero(f);
    if(t.name==='facturaId'){const fa=D.facturas.find(x=>x.id===t.value);if(fa){f.total.value=n2(fa.total);f.iva.value=fa.iva;calcDoc(f,'total');if(!f.descripcion.value)f.descripcion.value=fa.descripcion||''}}}
});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&t.id==='htxt'){e.preventDefault();t.form.requestSubmit()}
  else if(e.key==='Enter'&&(t.id==='gq'||t.closest&&t.closest('tr.filters'))&&S.lastList.length===1){ACT.abrirPaciente({id:S.lastList[0]})}
  else if(e.key==='Escape'){if(DIC){pararDictado();return}const o=$$('.ov').pop();if(o)o.querySelector('.x').click()}});
// búsqueda en gafas/recetas globales
document.addEventListener('input',e=>{const t=e.target;if(t.id==='gfq'){S.gq=t.value;rerenderKeep(t)}else if(t.id==='rfq'){S.rq=t.value;rerenderKeep(t)}});
function rerenderKeep(t){clearTimeout(rerenderKeep._t);const id=t.id;rerenderKeep._t=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#'+id);if(n){n.focus();n.setSelectionRange(pos,pos)}},200)}
$('#fimport').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  try{const data=JSON.parse(await file.text());if(data.app!=='gestion-clinica-oftalmologica'||!data.config)throw new Error('El archivo no es una copia de este programa');
    if(!(await confirmar(`La copia es del ${fdt(data.exportado)} y contiene ${(data.pacientes||[]).length} pacientes, ${(data.historial||[]).length} entradas de historial y ${(data.facturas||[]).length} facturas.<br><br><b>Se sustituirán todos los datos actuales, también en la nube.</b> ¿Continuar?`,'Restaurar','danger')))return;
    await restaurarNube(data);go('home');toast('Copia restaurada; subiendo a la nube…')}catch(err){toast('No se pudo restaurar: '+err.message)}});
$('#flogo').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>700*1024){toast('El logo es demasiado grande (máx. 700 KB)');return}
  const fr=new FileReader();fr.onload=async()=>{const h=D.config.cabeceras.find(c=>c.id===S.logoFor);if(h){h.logo=fr.result;await guardarCfg();render();toast('Logo guardado')}};fr.readAsDataURL(file)});
$('#ffiles').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(!files.length||!S.pid)return;let n=0;
  for(const f of files){if(f.size>20*1048576){toast(`“${f.name}” supera 20 MB`);continue}const id=uid();await putBlob(id,f);await guardar('archivos',{id,pacienteId:S.pid,nombre:f.name,tipo:f.type,size:f.size,n:Math.max(1,Math.ceil(f.size/CH)),autor:yo().id,creado:Date.now()});n++}
  if(n){S.tab='archivos';render();toast(n+' archivo'+(n>1?'s subidos':' subido'))}});
['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{SES.last=Date.now()},{passive:true}));
setInterval(()=>{if(!SES.user)return;const lim=(D.config.minutosBloqueo||30)*60000;if(Date.now()-SES.last>lim)bloquear()},15000);
setInterval(()=>{if(SES.user&&!document.hidden){sincronizar();if(S.refrescar)refrescarSiSeguro()}},45000);
let _focoT=0;window.addEventListener('focus',()=>{if(SES.user&&Date.now()-_focoT>10000){_focoT=Date.now();sincronizar()}comprobarVersion()});
window.addEventListener('online',()=>{if(SES.user)sincronizar()});
document.addEventListener('focusout',()=>{if(S.refrescar)setTimeout(()=>{if(S.refrescar)refrescarSiSeguro()},300)});
/* actualizaciones automáticas */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
async function comprobarVersion(){if(location.protocol!=='https:')return;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(j.v&&j.v!==APP_VERSION&&!$('#avisoVer')){const b=document.createElement('div');b.id='avisoVer';b.className='dicbar';b.style.background='var(--ac)';b.innerHTML=`<span>Hay una versión nueva del programa (${esc(j.v)}).</span><button class="sm" onclick="location.reload()">Actualizar ahora</button>`;document.body.appendChild(b)}}catch(e){}}
setInterval(comprobarVersion,10*60000);
window.addEventListener('beforeunload',e=>{if(SES.user&&(Object.values(S.drafts).some(Boolean)||$('.ov form'))){e.preventDefault();e.returnValue=''}});

(async()=>{try{db=await openDB();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();D.config=mergeCfg(await getOne('config','config'));
  NUBE.cfg=ls.get('cl_fb');if(!NUBE.cfg){pantallaAcceso('conectar');return}
  const a=ss.get('cl_auth');if(a&&a.rt){NUBE.auth=a;try{await token(true);await trasLogin();return}catch(e){if(e.code==='permiso'){pantallaAcceso('reglas');return}NUBE.auth=null;ss.del('cl_auth')}}
  pantallaAcceso('login')}catch(err){console.error(err);$('#app').innerHTML=`<div class="card">No se pudo arrancar el programa: ${esc(err.message)}. Prueba con Chrome o Edge actualizados.</div>`}})();
